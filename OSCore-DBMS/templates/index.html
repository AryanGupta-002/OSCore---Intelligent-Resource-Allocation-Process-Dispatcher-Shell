<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSCore - Job Management</title>
</head>
<body>

    <h1>OSCore Job Management</h1>

    <h2>Option 1: Enter Job Manually</h2>

    <form method="POST">
        <input type="hidden" name="entry_type" value="manual">

        <label>Job Name:</label>
        <input type="text" name="job_name" required><br><br>

        <label>Arrival Time:</label>
        <input type="number" name="arrival_time" min="0" required><br><br>

        <label>Priority:</label>
        <input type="number" name="priority" min="0" required><br><br>

        <label>CPU Time:</label>
        <input type="number" name="cpu_time" min="0" required><br><br>

        <label>Memory Required:</label>
        <input type="number" name="memory_required" min="0" required><br><br>

        <label>Printer Required:</label>
        <input type="number" name="printer_required" min="0" value="0"><br><br>

        <label>Scanner Required:</label>
        <input type="number" name="scanner_required" min="0" value="0"><br><br>

        <label>Modem Required:</label>
        <input type="number" name="modem_required" min="0" value="0"><br><br>

        <label>CD Drive Required:</label>
        <input type="number" name="cd_required" min="0" value="0"><br><br>

        <button type="submit">Submit Job</button>
    </form>

    <hr>

    <h2>Option 2: Upload Jobs Using CSV</h2>

    <p>Upload a CSV file containing job details.</p>

    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="entry_type" value="file">

        <input type="file" name="file" accept=".csv" required><br><br>

        <button type="submit">Upload and Save to Database</button>
    </form>

</body>
</html>
